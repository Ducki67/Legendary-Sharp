name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not major.minor.patch."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $version"

      - name: Build and publish native
        run: dotnet build "Legendary Sharp/Legendary Sharp.csproj" -c Release -p:Version=${{ steps.version.outputs.version }} --nologo

      - name: Name the asset
        shell: pwsh
        run: |
          $exe = "publish/LegendarySharp.exe"
          if (-not (Test-Path $exe)) { throw "Native publish produced no exe, refusing to release." }
          Copy-Item $exe "publish/LegendarySharp-v${{ steps.version.outputs.version }}.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "publish/LegendarySharp-v${{ steps.version.outputs.version }}.exe" `
            --title "Legendary C# ${{ steps.version.outputs.tag }}" `
            --generate-notes
