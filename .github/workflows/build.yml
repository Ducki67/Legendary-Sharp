name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and publish native
        run: dotnet build "Legendary Sharp/Legendary Sharp.csproj" -c Release --nologo

      - name: Check the native exe was produced
        shell: pwsh
        run: |
          $exe = "publish/LegendarySharp.exe"
          if (-not (Test-Path $exe)) { throw "Native publish produced no exe." }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Output "LegendarySharp.exe is $size MB"

      - uses: actions/upload-artifact@v4
        with:
          name: LegendarySharp
          path: publish/LegendarySharp.exe
          if-no-files-found: error
