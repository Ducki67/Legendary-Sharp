name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "Legendary Sharp/Legendary Sharp.csproj" -c Release

      - name: Smoke test
        shell: pwsh
        run: |
          ./publish/LegendarySharp.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $list = ./publish/LegendarySharp.exe list --confirmed --json | ConvertFrom-Json
          if ($list.Count -eq 0) { throw 'list returned nothing' }
          "$($list.Count) confirmed builds"
